<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        h1 {
            font-size: 2.2rem;
            color: #f0f6fc;
            margin-bottom: 0.5rem;
        }
        p {
            color: #8b949e;
            font-size: 1rem;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.25rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #8b949e;
            transform: translateY(-2px);
            background-color: #1f242c;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #58a6ff;
            margin-bottom: 0.5rem;
        }
        .card-footer {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #6e7681;
            font-family: monospace;
        }
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            color: #8b949e;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tool Hub</h1>
        <p>Collection of web tools and utilities</p>
    </header>

    <div class="container" id="tool-container">
        <div class="loading">Loading tools...</div>
    </div>

    <script>
        // Replace with your GitHub username and repository name
        const USERNAME = '3ekodomo';
        const REPO = 'site'; // Update this if your repository name is different

        async function loadTools() {
            const container = document.getElementById('tool-container');
            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`);
                if (!response.ok) throw new Error('Failed to fetch repository contents');
                
                const files = await response.json();
                
                // Filter for .html files, excluding index.html itself
                const htmlFiles = files.filter(file => 
                    file.type === 'file' && 
                    file.name.endsWith('.html') && 
                    file.name !== 'index.html'
                );

                if (htmlFiles.length === 0) {
                    container.innerHTML = '<div class="loading">No tools found.</div>';
                    return;
                }

                container.innerHTML = ''; // Clear loading message

                htmlFiles.forEach(file => {
                    // Format file name into a clean title (e.g., filegen.html -> Filegen)
                    const title = file.name
                        .replace('.html', '')
                        .replace(/[-_]/g, ' ')
                        .replace(/\b\w/g, l => l.toUpperCase());

                    const card = document.createElement('a');
                    card.href = file.name;
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-title">${title}</div>
                        </div>
                        <div class="card-footer">${file.name}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<div class="loading" style="color: #f85149;">Could not load tools automatically.</div>`;
                console.error(error);
            }
        }

        loadTools();
    </script>
</body>
</html>
