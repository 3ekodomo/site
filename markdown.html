<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Notes Explorer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <style>
        :root {
            --bg-color: #121212; --text-color: #e0e0e0; --accent: #ff5252;
            --panel-bg: #1e1e1e; --border-color: #333; --btn-text: #ffffff;
        }
        body.theme-light { --bg-color: #f7f7f7; --text-color: #24292e; --panel-bg: #ffffff; --border-color: #e1e4e8; }
        body.theme-black { --bg-color: #000000; --text-color: #cccccc; --panel-bg: #0a0a0a; --border-color: #222222; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 0; display: flex; flex-direction: column;
            height: 100vh; transition: background-color 0.3s, color 0.3s;
        }

        .navbar { background-color: var(--panel-bg); padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); }
        .navbar button { background: none; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; margin-left: 15px; }
        .navbar h2 { margin: 0; font-size: 18px; flex-grow: 1; font-weight: normal; }

        .view { display: none; padding: 20px; flex-grow: 1; overflow-y: auto; }
        .active-view { display: block; }
        
        .settings-form { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: auto; }
        .settings-form input, .settings-form select { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 4px; }
        .settings-form label { display: flex; align-items: center; gap: 10px; }
        
        .btn-primary { background: var(--accent); color: var(--btn-text); border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-success { background: #2ea44f; color: #ffffff; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;}
        
        .search-bar { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px;}
        .list-item { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .list-item:hover { background-color: var(--panel-bg); }
        .item-main { display: flex; align-items: center; gap: 15px; cursor: pointer; flex-grow: 1; overflow: hidden; }
        
        .menu-container { position: relative; display: inline-block; }
        .three-dots { background: none; border: none; color: inherit; cursor: pointer; font-size: 20px; padding: 0 5px; opacity: 0.7;}
        .three-dots:hover { opacity: 1; }
        .menu-options { 
            display: none; position: absolute; right: 0; top: 100%; 
            background: var(--panel-bg); border: 1px solid var(--border-color); 
            z-index: 10; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); min-width: 120px;
        }
        .menu-options button { display: block; width: 100%; text-align: left; padding: 10px; background: none; border: none; color: var(--text-color); cursor: pointer; font-size: 14px;}
        .menu-options button:hover { background: var(--bg-color); }
        .menu-container:focus-within .menu-options, .menu-container:hover .menu-options { display: block; }
        
        .folder-icon::before { content: "📁"; }
        .file-icon::before { content: "📄"; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        #viewer-container, #editor-container {
            width: 100%; min-height: 70vh; background-color: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; box-sizing: border-box; overflow-x: hidden;
        }
        #editor-container { display: none; padding: 0; background: transparent; border: none;}
        #editor-container .search-bar { margin-bottom: 10px; }
        textarea {
            width: 100%; height: 60vh; background: var(--panel-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; resize: none; font-family: monospace; font-size: 16px; outline: none; box-sizing: border-box;
        }
        
        video, audio, img { max-width: 100%; border-radius: 4px; display: block; margin: 10px auto; }
    </style>
</head>
<body>

    <div class="navbar">
        <button onclick="goBack()" id="back-btn" style="display: none; margin-left: 0; margin-right: 15px;">←</button>
        <h2 id="nav-title">GitHub Notes</h2>
        <button onclick="createNewItem()" title="Add Note or Folder">➕</button>
        <button onclick="showView('settings')" title="Settings">⚙️</button>
    </div>

    <!-- Settings View -->
    <div id="view-settings" class="view">
        <div class="settings-form">
            <h3>Configuration</h3>
            <p style="opacity: 0.8; font-size: 14px; margin-top: 0;">Please enter your details to access your repository.</p>
            <input type="password" id="gh-token" placeholder="GitHub PAT Token">
            <input type="text" id="gh-owner" placeholder="Repo Owner">
            <input type="text" id="gh-repo" placeholder="Repo Name">
            
            <label>
                Theme:
                <select id="theme-select">
                    <option value="theme-dark">Dark Mode</option>
                    <option value="theme-light">Light Mode</option>
                    <option value="theme-black">AMOLED Black</option>
                </select>
            </label>

            <label><input type="checkbox" id="hide-attachments"> Hide "Attachment-..." items</label>
            <label><input type="checkbox" id="only-md"> Only show .md files</label>
            <label><input type="checkbox" id="use-headings"> Show first # heading as file name</label>

            <button class="btn-primary" onclick="saveSettings()">Save & Browse</button>
        </div>
    </div>

    <!-- Browser View -->
    <div id="view-browser" class="view">
        <input type="text" id="search-input" class="search-bar" placeholder="Filter files..." onkeyup="filterFiles()">
        <div id="file-list"></div>
    </div>

    <!-- Note View -->
    <div id="view-note" class="view">
        <div class="toolbar">
            <button class="btn-primary" id="toggle-btn" onclick="toggleMode()">Edit Mode</button>
            <button class="btn-success" onclick="saveFile()">Save to GitHub</button>
        </div>
        <div id="viewer-container"></div>
        <div id="editor-container">
            <input type="text" id="filepath-input" class="search-bar" placeholder="File path (e.g. folder/filename.md)">
            <textarea id="markdown-editor"></textarea>
        </div>
    </div>

    <!-- Media Preview View -->
    <div id="view-media" class="view" style="text-align: center;">
        <div class="toolbar" style="justify-content: center;">
            <button class="btn-success" id="media-download-btn">Download Media</button>
        </div>
        <div id="media-container" style="margin-top: 20px; display: flex; justify-content: center;"></div>
    </div>

    <script>
        // Namespaced Storage System
        const APP_PREFIX = 'mdreader_v2_';
        function setStore(key, value) { localStorage.setItem(APP_PREFIX + key, value); }
        function getStore(key) { return localStorage.getItem(APP_PREFIX + key); }

        let currentPath = [];
        let currentFileSha = null;
        let currentFilePath = "";
        let isEditMode = false;
        let directoryData = [];

        const renderer = new marked.Renderer();
        renderer.link = function(token) {
            let href = typeof token === 'object' ? token.href : arguments[0];
            let title = (typeof token === 'object' ? token.title : arguments[1]) || '';
            let text = (typeof token === 'object' ? token.text : arguments[2]) || '';
            return `<a href="${href || ''}" target="_blank" rel="noopener noreferrer" title="${title}">${text}</a>`;
        };
        
        renderer.image = function(token) {
            let href = typeof token === 'object' ? token.href : arguments[0];
            let title = (typeof token === 'object' ? token.title : arguments[1]) || '';
            let text = (typeof token === 'object' ? token.text : arguments[2]) || '';
            return `<img src="${href || ''}" alt="${text}" title="${title}" />`;
        };

        marked.setOptions({ renderer: renderer, gfm: true, breaks: true });

        const sanitizeOptions = {
            ADD_TAGS: ['video', 'audio', 'source', 'track', 'iframe', 'div', 'span', 'details', 'summary', 'kbd', 'br', 'hr', 'table', 'tr', 'td', 'th', 'thead', 'tbody'],
            ADD_ATTR: ['target', 'style', 'src', 'controls', 'autoplay', 'loop', 'muted', 'allow', 'allowfullscreen', 'frameborder', 'data-path', 'class', 'id', 'type', 'width', 'height']
        };

        const decodeBase64UTF8 = (base64) => {
            try { return decodeURIComponent(escape(atob(base64))); } 
            catch (e) { return atob(base64); }
        };
        const encodeBase64UTF8 = (str) => btoa(unescape(encodeURIComponent(str)));

        window.onload = () => {
            document.getElementById('theme-select').value = getStore('theme') || 'theme-dark';
            document.getElementById('hide-attachments').checked = getStore('hideAttachments') === 'true';
            document.getElementById('only-md').checked = getStore('onlyMd') === 'true';
            document.getElementById('use-headings').checked = getStore('useHeadings') === 'true';
            applyTheme();

            const token = getStore('ghToken');
            const owner = getStore('ghOwner');
            const repo = getStore('ghRepo');
            
            const urlParams = new URLSearchParams(window.location.search);
            const openPath = urlParams.get('open');
            
            if (openPath) {
                if (token && owner && repo) {
                    document.getElementById('gh-token').value = token;
                    document.getElementById('gh-owner').value = owner;
                    document.getElementById('gh-repo').value = repo;
                    
                    if (openPath.split('/').pop().includes('.')) {
                        openFile(openPath);
                    } else {
                        currentPath = openPath.split('/').filter(p => p);
                        loadDirectory();
                    }
                    return;
                } else {
                    alert("Please enter your GitHub credentials in settings first to view this shared link.");
                    showView('settings');
                    return;
                }
            }

            if (token && owner && repo) {
                document.getElementById('gh-token').value = token;
                document.getElementById('gh-owner').value = owner;
                document.getElementById('gh-repo').value = repo;
                loadDirectory();
            } else {
                showView('settings');
            }
        };

        function applyTheme() { document.body.className = document.getElementById('theme-select').value; }

        function showView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
            document.getElementById(`view-${viewName}`).classList.add('active-view');
            const backBtn = document.getElementById('back-btn');
            const title = document.getElementById('nav-title');

            if (viewName === 'settings') {
                backBtn.style.display = 'block'; backBtn.onclick = () => loadDirectory(); title.innerText = "Settings";
            } else if (viewName === 'browser') {
                backBtn.style.display = currentPath.length > 0 ? 'block' : 'none';
                backBtn.onclick = () => navigateUp();
                title.innerText = currentPath.length > 0 ? currentPath[currentPath.length - 1] : "Home";
                document.getElementById('search-input').value = ""; 
            } else if (viewName === 'note' || viewName === 'media') {
                backBtn.style.display = 'block'; backBtn.onclick = () => loadDirectory();
                title.innerText = currentFilePath.split('/').pop();
            }
        }

        function saveSettings() {
            setStore('ghToken', document.getElementById('gh-token').value);
            setStore('ghOwner', document.getElementById('gh-owner').value);
            setStore('ghRepo', document.getElementById('gh-repo').value);
            setStore('theme', document.getElementById('theme-select').value);
            setStore('hideAttachments', document.getElementById('hide-attachments').checked);
            setStore('onlyMd', document.getElementById('only-md').checked);
            setStore('useHeadings', document.getElementById('use-headings').checked);
            applyTheme(); currentPath = []; loadDirectory();
        }

        function getApiHeaders() {
            const token = getStore('ghToken');
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (token && token.trim() !== '') headers['Authorization'] = `token ${token.trim()}`;
            return headers;
        }

        async function createNewItem() {
            const input = prompt("Enter file name (e.g., 'notes.md').\nTo create a folder, add a file inside it (e.g., 'NewFolder/notes.md' or 'NewFolder/.gitkeep'):");
            if (!input) return;

            const owner = getStore('ghOwner');
            const repo = getStore('ghRepo');
            const basePath = currentPath.join('/');
            const newPath = basePath ? `${basePath}/${input}` : input;

            try {
                const putHeaders = { ...getApiHeaders(), 'Content-Type': 'application/json' };
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${newPath}`, {
                    method: 'PUT', headers: putHeaders,
                    body: JSON.stringify({ message: `Create ${newPath}`, content: encodeBase64UTF8("") })
                });
                
                if (!response.ok) throw new Error('Failed to create file/folder.');
                loadDirectory();
            } catch (error) { 
                alert(`Error: ${error.message}`); 
            }
        }

        async function loadDirectory() {
            showView('browser');
            const owner = getStore('ghOwner');
            const repo = getStore('ghRepo');
            const token = getStore('ghToken');
            const pathStr = currentPath.join('/');
            
            const hideAtt = getStore('hideAttachments') === 'true';
            const onlyMd = getStore('onlyMd') === 'true';
            const listContainer = document.getElementById('file-list');
            listContainer.innerHTML = "<p>Loading...</p>";

            if(!owner || !repo || !token) {
                listContainer.innerHTML = `<p style="color:var(--accent);">Missing credentials. Please check your settings.</p>`;
                showView('settings');
                return;
            }

            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${pathStr}`;

            try {
                const response = await fetch(url, { headers: getApiHeaders(), cache: 'no-store' });
                if (!response.ok) {
                    if (response.status === 401) throw new Error("Invalid GitHub Token. Check Settings.");
                    if (response.status === 404) {
                        directoryData = [];
                        renderFileList(directoryData);
                        return; // Empty directory or just created
                    }
                    throw new Error(`GitHub API Error: ${response.status}`);
                }
                
                let data = await response.json();
                if (!Array.isArray(data)) data = [data]; // In case it returns single file metadata

                if (hideAtt) data = data.filter(item => !item.name.startsWith('Attachment-'));
                if (onlyMd) data = data.filter(item => item.type === 'dir' || item.name.endsWith('.md'));

                data.sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                });

                directoryData = data;
                renderFileList(directoryData);

                if (getStore('useHeadings') === 'true') fetchAndApplyHeadings(owner, repo);
            } catch (error) { 
                listContainer.innerHTML = `<p style="color:var(--accent); font-weight:bold;">Error: ${error.message}</p>`; 
            }
        }

        function renderFileList(dataToRender) {
            const listContainer = document.getElementById('file-list');
            listContainer.innerHTML = "";

            if (dataToRender.length === 0) {
                listContainer.innerHTML = "<p style='opacity:0.6; text-align:center; margin-top:30px;'>Folder is empty.</p>";
                return;
            }

            dataToRender.forEach(item => {
                const div = document.createElement('div');
                div.className = 'list-item';

                const mainArea = document.createElement('div');
                mainArea.className = 'item-main';
                mainArea.innerHTML = `<span class="${item.type === 'dir' ? 'folder-icon' : 'file-icon'}"></span> <span id="title-${item.sha}">${item.name}</span>`;
                mainArea.onclick = () => item.type === 'dir' ? navigateDown(item.name) : openFile(item.path);

                const actionsArea = document.createElement('div');
                let menuHtml = `
                    <div class="menu-container">
                        <button class="three-dots">⋮</button>
                        <div class="menu-options">
                            <button onclick="event.stopPropagation(); shareFile('${item.path}')">Share Link</button>`;
                
                if (item.type === 'file') {
                    menuHtml += `
                            <button onclick="event.stopPropagation(); renameFile('${item.name}', '${item.path}', '${item.sha}')">Rename</button>
                            <button onclick="event.stopPropagation(); deleteFile('${item.name}', '${item.path}', '${item.sha}')">Delete</button>`;
                } else if (item.type === 'dir') {
                    menuHtml += `
                            <button onclick="event.stopPropagation(); renameFolder('${item.name}', '${item.path}', '${item.sha}')">Rename</button>`;
                }
                
                menuHtml += `
                        </div>
                    </div>`;
                
                actionsArea.innerHTML = menuHtml;
                div.appendChild(mainArea); 
                div.appendChild(actionsArea); 
                listContainer.appendChild(div);
            });
        }

        async function fetchAndApplyHeadings(owner, repo) {
            for (let item of directoryData) {
                if (item.type === 'file' && item.name.endsWith('.md')) {
                    try {
                        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${item.path}`, {
                            headers: getApiHeaders(),
                            cache: 'no-store'
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const text = decodeBase64UTF8(data.content);
                            const match = text.match(/^#\s+(.+)/m);
                            if (match) {
                                const titleEl = document.getElementById(`title-${item.sha}`);
                                if (titleEl) titleEl.innerText = match[1];
                            }
                        }
                    } catch (e) {}
                }
            }
        }

        function filterFiles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = directoryData.filter(item => item.name.toLowerCase().includes(query));
            renderFileList(filtered);
        }

        function navigateDown(folderName) { currentPath.push(folderName); loadDirectory(); }
        function navigateUp() { currentPath.pop(); loadDirectory(); }
        function goBack() {}

        async function openFile(filePath) {
            const owner = getStore('ghOwner');
            const repo = getStore('ghRepo');
            const token = getStore('ghToken');
            
            // Media Preview Handling with Explicit MIME types to prevent Blob failure
            if (filePath.match(/\.(png|jpe?g|gif|webp|svg|mp4|webm|ogg|mp3|wav)$/i)) {
                try {
                    const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3.raw' },
                        cache: 'no-store'
                    });
                    if (!response.ok) throw new Error('Media file not found or access denied.');
                    
                    const ext = filePath.split('.').pop().toLowerCase();
                    const mimeTypes = { 
                        'png': 'image/png', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'gif': 'image/gif', 
                        'webp': 'image/webp', 'svg': 'image/svg+xml', 'mp4': 'video/mp4', 'webm': 'video/webm', 
                        'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'ogg': 'audio/ogg' 
                    };
                    
                    const rawBlob = await response.blob();
                    const properBlob = new Blob([rawBlob], { type: mimeTypes[ext] || 'application/octet-stream' });
                    const url = URL.createObjectURL(properBlob);
                    
                    showMediaPreview(url, ext, filePath);
                } catch (e) { alert("Media error: " + e.message); }
                return;
            }

            currentFilePath = filePath;
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;

            try {
                const response = await fetch(url, { headers: getApiHeaders(), cache: 'no-store' });
                if (!response.ok) throw new Error('File access denied or invalid credentials.');

                const data = await response.json();
                currentFileSha = data.sha;
                
                document.getElementById('markdown-editor').value = decodeBase64UTF8(data.content);
                document.getElementById('filepath-input').value = currentFilePath;
                
                isEditMode = true; 
                toggleMode();
                showView('note');
            } catch (error) { alert("Error opening file: " + error.message); }
        }

        function showMediaPreview(url, ext, filePath) {
            currentFilePath = filePath;
            const container = document.getElementById('media-container');
            container.innerHTML = '';
            
            if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) {
                container.innerHTML = `<img src="${url}" style="max-width:100%; height:auto; border-radius:8px; max-height: 70vh;">`;
            } else if (['mp4','webm'].includes(ext)) {
                container.innerHTML = `<video controls src="${url}" style="max-width:100%; max-height: 70vh; border-radius:8px;"></video>`;
            } else if (['mp3','wav','ogg'].includes(ext)) {
                container.innerHTML = `<audio controls src="${url}" style="width:100%; max-width: 500px;"></audio>`;
            }
            
            const dlBtn = document.getElementById('media-download-btn');
            dlBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url; a.download = filePath.split('/').pop();
                a.click();
            };
            
            showView('media');
        }

        async function loadAuthMedia(container) {
            const owner = getStore('ghOwner');
            const repo = getStore('ghRepo');
            const token = getStore('ghToken');
            
            const mediaElements = container.querySelectorAll('.auth-media');
            
            for (let el of mediaElements) {
                const mediaPath = el.getAttribute('data-path');
                if (!mediaPath) continue;
                
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${mediaPath}`;
                try {
                    const response = await fetch(url, {
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3.raw' },
                        cache: 'default'
                    });
                    
                    if (response.ok) {
                        const ext = mediaPath.split('.').pop().toLowerCase();
                        const mimeTypes = { 'png': 'image/png', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'gif': 'image/gif', 'webp': 'image/webp', 'svg': 'image/svg+xml', 'mp4': 'video/mp4', 'webm': 'video/webm' };
                        
                        const rawBlob = await response.blob();
                        const blob = new Blob([rawBlob], { type: mimeTypes[ext] || 'application/octet-stream' });
                        const objectUrl = URL.createObjectURL(blob);
                        el.src = objectUrl;
                        
                        if (el.tagName === 'IMG') {
                            el.style.cursor = 'pointer';
                            el.onclick = () => showMediaPreview(objectUrl, ext, mediaPath);
                        }
                    } else {
                        if (el.tagName === 'IMG') el.alt = `Failed to load: ${mediaPath}`;
                    }
                } catch (e) { console.error("Error fetching media:", e); }
            }
        }

        function toggleMode() {
            isEditMode = !isEditMode;
            const viewer = document.getElementById('viewer-container');
            const editor = document.getElementById('editor-container');
            const toggleBtn = document.getElementById('toggle-btn');

            if (isEditMode) {
                viewer.style.display = 'none'; editor.style.display = 'block'; toggleBtn.innerText = 'Switch to View Mode';
            } else {
                const rawMarkdown = document.getElementById('markdown-editor').value;
                const htmlOutput = marked.parse(rawMarkdown);
                const sanitizedHtml = DOMPurify.sanitize(htmlOutput, sanitizeOptions);
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = sanitizedHtml;
                
                const allMedia = tempDiv.querySelectorAll('img, video, audio, source');
                allMedia.forEach(el => {
                    const src = el.getAttribute('src');
                    if (src && !src.startsWith('http') && !src.startsWith('data:') && !src.startsWith('blob:')) {
                        let resolvedPath = src;
                        if (resolvedPath.startsWith('/')) resolvedPath = resolvedPath.substring(1);
                        else {
                            let basePath = currentPath.join('/');
                            resolvedPath = basePath ? `${basePath}/${resolvedPath}` : resolvedPath;
                        }
                        
                        el.removeAttribute('src'); 
                        el.setAttribute('data-path', resolvedPath);
                        el.classList.add('auth-media');
                    }
                });
                
                viewer.innerHTML = '';
                viewer.appendChild(tempDiv);
                loadAuthMedia(viewer); 
                
                editor.style.display = 'none'; viewer.style.display = 'block'; toggleBtn.innerText = 'Switch to Edit Mode';
            }
        }

        async function saveFile() {
            const owner = getStore('ghOwner'); 
            const repo = getStore('ghRepo');
            const content = document.getElementById('markdown-editor').value;
            const newFilePath = document.getElementById('filepath-input').value.trim();

            if (!newFilePath) return alert("File path cannot be empty.");

            try {
                const putHeaders = { ...getApiHeaders(), 'Content-Type': 'application/json' };
                
                // Handling internal path changes via the editor path input
                if (newFilePath !== currentFilePath) {
                    
                    // 1. Create file at new path
                    const createRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${newFilePath}`, {
                        method: 'PUT', headers: putHeaders,
                        body: JSON.stringify({ message: `Create/Move to ${newFilePath}`, content: encodeBase64UTF8(content) })
                    });
                    if (!createRes.ok) throw new Error('Failed to save to the new path.');
                    const newData = await createRes.json();

                    // 2. Delete original file
                    if (currentFileSha) {
                        await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${currentFilePath}`, {
                            method: 'DELETE', headers: putHeaders, 
                            body: JSON.stringify({ message: `Delete old ${currentFilePath} after rename/move`, sha: currentFileSha })
                        });
                    }

                    // Update UI Context
                    currentFilePath = newFilePath;
                    currentFileSha = newData.content.sha;
                    document.getElementById('nav-title').innerText = currentFilePath.split('/').pop();

                } else {
                    // Standard Update
                    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${currentFilePath}`;
                    const response = await fetch(url, {
                        method: 'PUT', headers: putHeaders,
                        body: JSON.stringify({ message: `Update ${currentFilePath}`, content: encodeBase64UTF8(content), sha: currentFileSha })
                    });
                    if (!response.ok) throw new Error('Failed to save file.');
                    const data = await response.json(); 
                    currentFileSha = data.content.sha;
                }
                
                alert("Saved successfully!"); 
                if (isEditMode) toggleMode();
            } catch (error) { 
                alert(error.message); 
            }
        }

        function shareFile(itemPath) {
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?open=${encodeURIComponent(itemPath)}`;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('Share link copied to clipboard:\n' + shareUrl);
                }).catch(() => { prompt("Copy the share link below:", shareUrl); });
            } else {
                prompt("Copy the share link below:", shareUrl);
            }
        }

        async function renameFile(itemName, itemPath, itemSha) {
            const newName = prompt("Enter new filename (include extension, e.g., .md):", itemName);
            if (!newName || newName === itemName) return;
            const owner = getStore('ghOwner'); const repo = getStore('ghRepo');
            const basePath = currentPath.join('/'); const newPath = basePath ? `${basePath}/${newName}` : newName;
            
            try {
                const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${itemPath}`, { headers: getApiHeaders(), cache: 'no-store' });
                const fileData = await getRes.json();
                
                const putHeaders = { ...getApiHeaders(), 'Content-Type': 'application/json' };
                const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${newPath}`, {
                    method: 'PUT', headers: putHeaders, body: JSON.stringify({ message: `Rename ${itemName} to ${newName}`, content: fileData.content })
                });
                if (!putRes.ok) throw new Error('Failed to create new file.');
                
                const delRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${itemPath}`, {
                    method: 'DELETE', headers: putHeaders, body: JSON.stringify({ message: `Delete old ${itemName} after rename`, sha: fileData.sha })
                });
                if (!delRes.ok) throw new Error('Failed to delete old file.');
                loadDirectory();
            } catch (error) { alert(`Error renaming file: ${error.message}`); }
        }

        async function renameFolder(oldName, oldPath, itemSha) {
            const newName = prompt("Enter new folder name:", oldName);
            if (!newName || newName === oldName) return;
            
            const owner = getStore('ghOwner');
            const repo = getStore('ghRepo');
            const basePath = currentPath.join('/');
            const newPath = basePath ? `${basePath}/${newName}` : newName;

            try {
                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: getApiHeaders(), cache: 'no-store' });
                if (!res.ok) throw new Error("Failed to fetch repository info");
                let repoInfo = await res.json();
                let branch = repoInfo.default_branch;

                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`, { headers: getApiHeaders(), cache: 'no-store' });
                if (!res.ok) throw new Error("Failed to fetch branch reference");
                let refData = await res.json();
                let latestCommitSha = refData.object.sha;

                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits/${latestCommitSha}`, { headers: getApiHeaders(), cache: 'no-store' });
                if (!res.ok) throw new Error("Failed to fetch commit data");
                let commitData = await res.json();
                let baseTreeSha = commitData.tree.sha;

                const postHeaders = { ...getApiHeaders(), 'Content-Type': 'application/json' };
                const treePayload = {
                    base_tree: baseTreeSha,
                    tree: [
                        { path: oldPath, mode: "040000", type: "tree", sha: null },
                        { path: newPath, mode: "040000", type: "tree", sha: itemSha }
                    ]
                };
                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees`, { 
                    method: 'POST', headers: postHeaders, body: JSON.stringify(treePayload) 
                });
                if (!res.ok) throw new Error("Failed to build new directory tree");
                let treeData = await res.json();
                let newTreeSha = treeData.sha;

                const commitPayload = { message: `Rename folder ${oldName} to ${newName}`, tree: newTreeSha, parents: [latestCommitSha] };
                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/commits`, { 
                    method: 'POST', headers: postHeaders, body: JSON.stringify(commitPayload) 
                });
                if (!res.ok) throw new Error("Failed to register commit");
                let newCommitData = await res.json();
                let newCommitSha = newCommitData.sha;

                const refPayload = { sha: newCommitSha, force: false };
                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/refs/heads/${branch}`, { 
                    method: 'PATCH', headers: postHeaders, body: JSON.stringify(refPayload) 
                });
                if (!res.ok) throw new Error("Failed to update branch reference");

                loadDirectory();
            } catch (error) {
                alert(`Error renaming folder: ${error.message}`);
            }
        }

        async function deleteFile(itemName, itemPath, itemSha) {
            if (!confirm(`Are you sure you want to delete ${itemName}? This cannot be undone.`)) return;
            const owner = getStore('ghOwner'); const repo = getStore('ghRepo');
            try {
                const delHeaders = { ...getApiHeaders(), 'Content-Type': 'application/json' };
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${itemPath}`, {
                    method: 'DELETE', headers: delHeaders, body: JSON.stringify({ message: `Delete ${itemName}`, sha: itemSha })
                });
                if (!response.ok) throw new Error('Failed to delete file.');
                loadDirectory();
            } catch (error) { alert(error.message); }
        }
    </script>
